<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>WaterlooWorks tab diagnostics</title></head>
<body class="inbox"><main><h1>WaterlooWorks tab diagnostics</h1><p id="build"></p><p>Inspect an open tab without clicking or submitting. HTML excludes scripts, hidden values, credentials and URL parameters. Other field values are redacted; selected document IDs remain visible.</p>
<button id="refresh" class="secondary">Refresh tab list</button><label>WaterlooWorks tab <select id="tabs"></select></label><label><input id="include-html" type="checkbox" checked> Include sanitized HTML</label><button id="inspect">Capture current state</button><p id="diagnostic-status" role="status"></p>
<h2>Current state</h2><button id="copy-state" class="secondary" disabled>Copy state JSON</button><textarea id="state" readonly rows="20" aria-label="Current tab state JSON"></textarea>
<h2>Sanitized HTML</h2><button id="copy-html" class="secondary" disabled>Copy HTML</button><textarea id="html" readonly rows="20" aria-label="Sanitized tab HTML"></textarea></main><script type="module" src="diagnostics.js"></script></body></html>
