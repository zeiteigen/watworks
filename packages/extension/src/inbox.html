<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>Discovery inbox</title></head>
<body class="inbox"><main><h1>Daily discovery</h1><label><input id="enabled" type="checkbox"> Enable daily discovery</label><label>Run after hour (America/Toronto by default) <input id="hour" type="number" min="0" max="23" value="9"></label><label>Minimum score <input id="threshold" type="number" step="0.1" value="1"></label><button id="save">Save settings</button><button id="check" class="secondary">Check now</button><p id="message" role="status"></p><h2>Matching rules</h2><p>Your agent manages job interests and matching rules. Ask it to change the roles, locations, or other interests used for discovery.</p><ul id="rules"></ul><h2>Saved postings</h2><button id="copy" class="secondary">Copy agent prompt</button><ol id="results"></ol></main><script type="module" src="inbox.js"></script></body></html>
